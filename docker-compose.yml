# Local development only. Synthetic data, no real credentials.
# Staging and production use managed MongoDB (Atlas) with their own users and secrets.
services:
  mongo:
    image: mongo:8
    container_name: noor-mongo
    # A single-node replica set, because MongoDB transactions require one.
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      # Bound to localhost only; 27018 avoids clashing with a local MongoDB on 27017.
      - "127.0.0.1:27018:27017"
    volumes:
      - noor_mongodata:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok }",
        ]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  # Internal AI service in mock mode: contract-valid fake results, no GPU needed
  # (Architecture 8.1). The API reaches it at AI_SERVICE_URL=http://127.0.0.1:8000.
  ai:
    build: ./services/ai
    container_name: noor-ai
    environment:
      MOCK_MODE: "true"
    ports:
      # Localhost only: the AI service is never exposed to browsers or the network.
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

volumes:
  noor_mongodata:

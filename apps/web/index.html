<!doctype html>
<html lang="en" dir="ltr" class="h-full antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1b6b5a" />
    <title>Noor Academy | نور أكاديمي</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body class="flex min-h-full flex-col font-sans">
    <div id="root" class="flex flex-1 flex-col">
      <!-- Shown until the app starts, so a slow connection never sees a blank page (X06). -->
      <main
        aria-busy="true"
        class="mx-auto flex w-full max-w-5xl flex-1 flex-col gap-6 px-4 py-8 sm:px-6"
      >
        <div class="h-8 w-1/3 rounded-control bg-surface-muted motion-safe:animate-pulse"></div>
        <div class="h-4 w-full rounded bg-surface-muted motion-safe:animate-pulse"></div>
        <div class="h-4 w-2/3 rounded bg-surface-muted motion-safe:animate-pulse"></div>
      </main>
    </div>
    <noscript>نور أكاديمي يحتاج إلى JavaScript. Noor Academy needs JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

name: Container

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Container build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -f apps/api/Dockerfile -t noor-api:ci .

      - name: Runs and answers health checks
        run: |
          docker run -d --name api -p 5000:5000 \
            -e NODE_ENV=development \
            -e DATABASE='mongodb://ci:<PASSWORD>@127.0.0.1:1/ci' \
            -e DATABASE_PASSWORD=ci-password \
            -e JWT_SECRET=ci-only-secret-at-least-32-characters-long \
            noor-api:ci
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5000/api/v1/health; then ok=1; break; fi
            sleep 1
          done
          docker logs api
          [ "$ok" = "1" ]

      - name: Protected routes refuse anonymous requests
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:5000/api/v1/children)
          echo "GET /api/v1/children -> $code"
          [ "$code" = "401" ]

      - name: Production refuses an invalid configuration
        run: |
          # Production with a missing/short secret and no database: the app must refuse to start.
          if docker run --rm \
            -e NODE_ENV=production -e JWT_SECRET=short \
            noor-api:ci; then
            echo "The container started with an invalid production configuration"
            exit 1
          fi

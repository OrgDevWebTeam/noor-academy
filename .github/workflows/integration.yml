name: Integration

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api-integration:
    name: API integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      MONGODB_TEST_URI: mongodb://127.0.0.1:27017/?directConnection=true
      # The api tests start a throwaway MongoDB (mongodb-memory-server). Pin a build that
      # exists for the runner, because newer Ubuntu images have no MongoDB binary yet.
      MONGOMS_DISTRO: ubuntu-22.04
      MONGOMS_VERSION: 7.0.14
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Shared packages must be built before the API tests import them.
      - run: pnpm build
      # Includes the cross-family and unassigned-teacher isolation tests (release gate).
      - run: pnpm --filter @noor/api test:integration
